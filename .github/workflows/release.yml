name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build and publish"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: sh -n scripts/install.sh packaging/openrc/iepl-agent packaging/openrc/iepl-agent-maintenance scripts/generate-sbom.sh scripts/generate-provenance.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache: true
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: go build -buildvcs=false -trimpath -ldflags "-s -w -X main.version=${RELEASE_TAG}" -o "iepl-agent-linux-${GOARCH}" ./cmd/iepl-agent
      - uses: actions/upload-artifact@v4
        with:
          name: iepl-agent-linux-${{ matrix.arch }}
          path: iepl-agent-linux-${{ matrix.arch }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@v3
      - name: Stage packaging
        run: |
          cp scripts/install.sh dist/install.sh
          cp packaging/systemd/iepl-agent.service dist/iepl-agent.service
          cp packaging/openrc/iepl-agent dist/iepl-agent.openrc
          cp packaging/systemd/iepl-agent-maintenance.service dist/iepl-agent-maintenance.service
          cp packaging/openrc/iepl-agent-maintenance dist/iepl-agent-maintenance.openrc
          sh scripts/generate-sbom.sh "${RELEASE_TAG}" dist/sbom.cdx.json
          sh scripts/generate-provenance.sh dist/provenance.intoto.json \
            dist/iepl-agent-linux-amd64 dist/iepl-agent-linux-arm64 \
            dist/install.sh dist/iepl-agent.service dist/iepl-agent.openrc \
            dist/iepl-agent-maintenance.service dist/iepl-agent-maintenance.openrc \
            dist/sbom.cdx.json
      - name: Checksums
        run: cd dist && sha256sum iepl-agent-linux-* install.sh iepl-agent.service iepl-agent.openrc iepl-agent-maintenance.service iepl-agent-maintenance.openrc sbom.cdx.json provenance.intoto.json > checksums.txt
      - name: Sign release manifest
        run: cosign sign-blob --yes --bundle dist/checksums.sigstore.json dist/checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          generate_release_notes: true
